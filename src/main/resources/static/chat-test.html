<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Stream Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .user { color: blue; font-weight: bold; }
        .ai { color: green; }
        #input-container { display: flex; }
        #msg-input { flex-grow: 1; padding: 5px; }
        button { padding: 5px 15px; margin-left: 5px; }
    </style>
</head>
<body>
    <h1>AI Chat Stream Test (WebSocket)</h1>
    <div id="chat-box"></div>
    <div id="input-container">
        <input type="text" id="msg-input" placeholder="输入消息..." onkeypress="if(event.keyCode==13) sendMessage()">
        <button onclick="sendMessage()">发送</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        let socket = null;

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            socket = new WebSocket(`${protocol}//${host}/api/ai/chat`);

            socket.onopen = () => {
                appendChat('系统', 'WebSocket 连接已建立', 'system');
            };

            socket.onmessage = (event) => {
                // 流式返回，增量显示
                appendChat('AI', event.data, 'ai', true);
            };

            socket.onclose = () => {
                appendChat('系统', 'WebSocket 连接已关闭', 'system');
                // 自动重连
                setTimeout(connect, 3000);
            };

            socket.onerror = (error) => {
                appendChat('系统', 'WebSocket 错误', 'system');
            };
        }

        function sendMessage() {
            const msg = msgInput.value.trim();
            if (!msg) return;

            if (socket && socket.readyState === WebSocket.OPEN) {
                appendChat('User', msg, 'user');
                socket.send(msg);
                msgInput.value = '';
                // 准备好接受 AI 的流式回复
                aiResponseBuffer = "";
                lastAiDiv = null;
            } else {
                alert('WebSocket 未连接');
            }
        }

        let lastAiDiv = null;
        function appendChat(role, text, className, isStreaming = false) {
            if (isStreaming && role === 'AI' && lastAiDiv) {
                lastAiDiv.innerText += text;
            } else {
                const div = document.createElement('div');
                div.innerHTML = `<span class="${className}">${role}: </span><span>${text}</span>`;
                chatBox.appendChild(div);
                if (isStreaming && role === 'AI') {
                    lastAiDiv = div.querySelectorAll('span')[1];
                } else {
                    lastAiDiv = null;
                }
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        connect();
    </script>
</body>
</html>
